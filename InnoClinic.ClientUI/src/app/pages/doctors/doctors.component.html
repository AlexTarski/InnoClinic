<div class="doctors-page">
	<div class="component-header page-header">
		Our Doctors
	</div>

	<div class="search-bar">
		<input type="text" placeholder="Search doctor..." class="search-input">
		<button class="search-btn">
			<div class="search-icon">
				<svg class="search-icon" icon="search"></svg>
			</div>
		</button>
	</div>

	<div class="filters">
		<mat-form-field appearance="fill">
			<mat-label>Specialization</mat-label>
			<mat-select>
				<mat-option value="spec1">spec1</mat-option>
				<mat-option value="spec2">spec2</mat-option>
				<mat-option value="spec3">spec3</mat-option>
			</mat-select>
		</mat-form-field>

		<mat-form-field appearance="fill">
			<mat-label>Office</mat-label>
			<mat-select>
				<mat-option value="spec1">office1</mat-option>
				<mat-option value="spec2">office2</mat-option>
				<mat-option value="spec3">office3</mat-option>
			</mat-select>
		</mat-form-field>

		<button class="map-btn">
			<div class="map-icon">
				<svg class="map-icon" icon="maps"></svg>
			</div>
			<div class="map-btn-text">
				View office on map
			</div>
		</button>
	</div>
	<div class="doctors-grid">
		@for (doctor of doctors(); track doctor.id) {
			<app-doctor-card [doctor]="doctor" [currentYear]="currentYear" [specializations]="specializations()"></app-doctor-card>
		}
	</div>
</div>
